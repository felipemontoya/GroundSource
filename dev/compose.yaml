# Local development environment for GroundSource.
#
# `docker compose up` from this directory brings up PostgreSQL with
# pgvector, the Django backend on ASGI, and the page's dev server. This file
# holds orchestration only: each service's Dockerfile lives next to the code
# it builds, so ops/ can reference the same images (see ../AGENTS.md).
#
# Everything here is disposable. The database volume can be removed and
# rebuilt; nothing in it is a source of truth.

name: groundsource

services:
  db:
    image: pgvector/pgvector:pg17
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-groundsource}
      POSTGRES_USER: ${POSTGRES_USER:-groundsource}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-groundsource-local-only}
      # Spanish is the first target language; the collation has to be there
      # before initdb runs, not after.
      POSTGRES_INITDB_ARGS: "--locale-provider=icu --icu-locale=es --encoding=UTF8"
    volumes:
      - pgdata:/var/lib/postgresql/data
      # Applied once, when the data directory is empty.
      - ./postgres/initdb:/docker-entrypoint-initdb.d:ro
    ports:
      - "${DB_PORT:-5432}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-groundsource} -d ${POSTGRES_DB:-groundsource}"]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 10s
    restart: unless-stopped

  api:
    build:
      context: ../api
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-groundsource}
      POSTGRES_USER: ${POSTGRES_USER:-groundsource}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-groundsource-local-only}
      POSTGRES_HOST: db
      POSTGRES_PORT: 5432
      DJANGO_SECRET_KEY: ${DJANGO_SECRET_KEY:-dev-only-insecure-key-do-not-deploy}
      DJANGO_DEBUG: ${DJANGO_DEBUG:-1}
      DJANGO_ALLOWED_HOSTS: ${DJANGO_ALLOWED_HOSTS:-localhost,127.0.0.1,api}
      DJANGO_LOG_LEVEL: ${DJANGO_LOG_LEVEL:-INFO}
      # Absent is fine: ingestion and lexical retrieval work without a key,
      # and the API reports the degraded state instead of failing.
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      EMBEDDING_MODEL: ${EMBEDDING_MODEL:-text-embedding-3-small}
      EMBEDDING_DIMENSIONS: ${EMBEDDING_DIMENSIONS:-1536}
      CHAT_MODEL: ${CHAT_MODEL:-gpt-5.4-nano}
      CHAT_MAX_OUTPUT_TOKENS: ${CHAT_MAX_OUTPUT_TOKENS:-1200}
      PIPELINE_VERSION: ${PIPELINE_VERSION:-0.1.0}
      SOURCES_DIR: /sources
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-}
      CLIENT_IP_HEADER: ${CLIENT_IP_HEADER:-}
      ASK_DAILY_MODEL_LIMIT: ${ASK_DAILY_MODEL_LIMIT:-0}
      ASK_PER_CLIENT_LIMIT: ${ASK_PER_CLIENT_LIMIT:-0}
      ASK_PER_CLIENT_WINDOW_SECONDS: ${ASK_PER_CLIENT_WINDOW_SECONDS:-3600}
    volumes:
      # Read-only: the container runs the source, it does not edit it.
      - ../api:/app:ro
      # Ingested sources are mounted, never baked into the image.
      - ../sources:/sources:ro
    ports:
      - "${API_PORT:-8000}:8000"
    depends_on:
      db:
        condition: service_healthy
    command:
      - uvicorn
      - groundsource.asgi:application
      - --host=0.0.0.0
      - --port=8000
      - --reload
      - --reload-dir=/app
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://localhost:8000/health', timeout=4).status == 200 else 1)\""]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 20s
    restart: unless-stopped

  # One-off code generation: makemigrations and anything else that writes
  # into the source tree. Separate from `api` because `api` mounts the code
  # read-only on purpose — the server runs the source, it does not edit it —
  # and relaxing that for the sake of an occasional command would remove the
  # guarantee for every command.
  #
  #   docker compose run --rm tools python manage.py makemigrations
  tools:
    profiles: ["tools"]
    build:
      context: ../api
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-groundsource}
      POSTGRES_USER: ${POSTGRES_USER:-groundsource}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-groundsource-local-only}
      POSTGRES_HOST: db
      POSTGRES_PORT: 5432
      DJANGO_SECRET_KEY: ${DJANGO_SECRET_KEY:-dev-only-insecure-key-do-not-deploy}
      DJANGO_DEBUG: ${DJANGO_DEBUG:-1}
      RUN_MIGRATIONS: "0"
    volumes:
      - ../api:/app
    # Files it generates (migrations) land in the source tree, so they
    # must belong to the user who will edit and commit them. Override
    # with DOCKER_USER in dev/.env if this machine is not uid 1000.
    user: "${DOCKER_USER:-1000:1000}"
    depends_on:
      db:
        condition: service_healthy
    entrypoint: ["/app/docker-entrypoint.sh"]
    command: ["python", "manage.py", "help"]

  web:
    build:
      context: ../pages/web
      target: dev
    environment:
      # Where the dev server's /api proxy forwards to.
      API_ORIGIN: http://api:8000
    volumes:
      - ../pages/web:/app
      # Keep the image's node_modules; do not let the host's shadow it.
      - web_node_modules:/app/node_modules
    ports:
      - "${WEB_PORT:-5173}:5173"
    depends_on:
      api:
        condition: service_started
    restart: unless-stopped

  # The public page for the agreement, fixed to one document. Same shape
  # as `web`, on its own port.
  acuerdo:
    build:
      context: ../pages/acuerdo
      target: dev
    environment:
      API_ORIGIN: http://api:8000
    volumes:
      - ../pages/acuerdo:/app
      - acuerdo_node_modules:/app/node_modules
    ports:
      - "${ACUERDO_PORT:-5174}:5174"
    depends_on:
      api:
        condition: service_started
    restart: unless-stopped

volumes:
  pgdata:
  web_node_modules:
  acuerdo_node_modules:
